name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Créer le projet Android
        run: flutter create --platforms=android --org com.playerflow --project-name player_flow .

      - name: Configuration Android
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <base-config cleartextTrafficPermitted="true">
              <trust-anchors>
                <certificates src="system" />
                <certificates src="user" />
              </trust-anchors>
            </base-config>
          </network-security-config>
          EOF
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-feature android:name="android.software.leanback" android:required="false" />
            <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
            <application
              android:label="Player Flow"
              android:name="${applicationName}"
              android:icon="@mipmap/ic_launcher"
              android:usesCleartextTraffic="true"
              android:networkSecurityConfig="@xml/network_security_config"
              android:allowBackup="false">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:launchMode="singleTop"
                android:theme="@style/LaunchTheme"
                android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                android:hardwareAccelerated="true"
                android:supportsPictureInPicture="true"
                android:windowSoftInputMode="adjustResize">
                <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                  <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                </intent-filter>
              </activity>
              <meta-data android:name="flutterEmbedding" android:value="2" />
            </application>
            <queries>
              <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>
              <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="mailto" /></intent>
            </queries>
          </manifest>
          EOF
          G=android/app/build.gradle
          [ -f android/app/build.gradle.kts ] && G=android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' "$G"

      - name: Préparer les assets manquants
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          mkdir -p assets/images assets/sounds
          if [ ! -f assets/images/logo.png ]; then
            ffmpeg -y -f lavfi -i "color=c=0x14B8A6:s=1024x1024" -frames:v 1 assets/images/logo.png
          fi
          if [ ! -f assets/images/logo_foreground.png ]; then
            ffmpeg -y -i assets/images/logo.png -vf "scale=700:700,format=rgba,pad=1024:1024:162:162:color=0x00000000" -frames:v 1 assets/images/logo_foreground.png
          fi
          if [ ! -f assets/sounds/intro.mp3 ]; then
            ffmpeg -y -f lavfi -i "sine=frequency=660:duration=1" -q:a 5 assets/sounds/intro.mp3
          fi

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: dart run flutter_native_splash:create
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: player-flow-apk
          path: build/app/outputs/flutter-apk/app-release.apk
