name: player_flow
description: Player Flow - lecteur IPTV (aucun contenu fourni).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  audioplayers: ^6.0.0
  cached_network_image: ^3.3.1
  wakelock_plus: ^1.2.8
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo.png
  adaptive_icon_background: "#040A18"
  adaptive_icon_foreground: assets/images/logo_foreground.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#0E131C"
  image: assets/images/logo_foreground.png
  android_12:
    color: "#0E131C"
    image: assets/images/logo_foreground.png
